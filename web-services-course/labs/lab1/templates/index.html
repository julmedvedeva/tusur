<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЛР1 — Крест на изображении</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
        fieldset { margin-bottom: 16px; padding: 12px; }
        label { display: block; margin: 8px 0 4px; }
        .flash { color: #b00020; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>Наложение креста на изображение</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash">
                {% for m in messages %}<p>{{ m }}</p>{% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('process') }}" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Изображение</legend>
            <label for="image">Файл изображения (png/jpg/jpeg/bmp)</label>
            <input type="file" id="image" name="image" accept="image/*" required>
        </fieldset>

        <fieldset>
            <legend>Параметры креста</legend>
            <label for="orientation">Ориентация</label>
            <select id="orientation" name="orientation">
                <option value="vertical">Вертикальный</option>
                <option value="horizontal">Горизонтальный</option>
                <option value="both">Оба</option>
            </select>

            <label for="color">Цвет</label>
            <input type="color" id="color" name="color" value="#ff0000">

            <label for="thickness">Толщина (px)</label>
            <input type="number" id="thickness" name="thickness" value="10" min="1" max="200">
        </fieldset>

        <fieldset>
            <legend>Проверка (капча)</legend>
            <label for="captcha">Сколько будет {{ captcha_question }}?</label>
            <input type="text" id="captcha" name="captcha" required autocomplete="off">
        </fieldset>

        <button type="submit">Обработать</button>
    </form>
</body>
</html>
