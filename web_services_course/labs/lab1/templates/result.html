<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЛР1 — Результат</title>
    <style>
        body { font-family: sans-serif; max-width: 960px; margin: 40px auto; }
        .row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
        .col { flex: 1; min-width: 300px; text-align: center; }
        img { max-width: 100%; border: 1px solid #ccc; }
        a.back { display: inline-block; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>Готово</h1>

    <div class="row">
        <div class="col">
            <h3>Исходное изображение</h3>
            <img src="{{ original_url }}" alt="original">
        </div>
        <div class="col">
            <h3>Новое изображение (с крестом)</h3>
            <img src="{{ result_url }}" alt="result">
        </div>
    </div>

    <div class="row">
        <div class="col">
            <img src="data:image/png;base64,{{ hist_original }}" alt="hist original">
        </div>
        <div class="col">
            <img src="data:image/png;base64,{{ hist_result }}" alt="hist result">
        </div>
    </div>

    <a class="back" href="{{ url_for('index') }}">&larr; Обработать другое изображение</a>
</body>
</html>
